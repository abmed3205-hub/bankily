<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Bankily - تسجيل الدخول</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; background-color: #ffffff; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        .app-screen { 
            position: relative; 
            width: 100%; 
            max-width: 430px; 
            height: 100vh; 
        }
        
        .app-screen img { 
            width: 100%; 
            height: 100%; 
            object-fit: fill; 
            display: block; 
        }
        
        /* حقل رقم الهاتف الشفاف فوق الخط المرسوم في الصورة */
        .input-phone {
            position: absolute;
            top: 40%;     /* موقع حقل الهاتف رأسياً */
            left: 12%;    /* الموقع أفقياً */
            width: 76%;   /* العرض */
            height: 40px; /* الارتفاع */
            background: transparent;
            border: none;
            outline: none;
            font-size: 16px;
            text-align: right;
            color: #000;
        }

        /* حقل الرقم السري الشفاف فوق خانات النقاط في الصورة */
        .input-pin {
            position: absolute;
            top: 53%;     /* موقع حقل الرقم السري رأسياً */
            left: 38%;    /* الموقع أفقياً */
            width: 30%;   /* العرض */
            height: 40px; /* الارتفاع */
            background: transparent;
            border: none;
            outline: none;
            font-size: 20px;
            letter-spacing: 12px;
            text-align: center;
            color: #000;
        }

        /* زر تسجيل الدخول الشفاف يوجه إلى لوحة القيادة عند النقر */
        .hotspot-login {
            position: absolute;
            top: 65%;     /* موقع زر الدخول أو أسفل الشاشة */
            left: 10%;
            width: 80%;
            height: 50px;
            background: transparent;
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body>

    <div class="app-screen">
        <!-- 1. صورة واجهة تسجيل الدخول الأصلية -->
        <img src="login.png" alt="Login">

        <!-- 2. حقل إدخال رقم الهاتف الحقيقي (قابل للكتابة) -->
        <input type="tel" class="input-phone" placeholder="">

        <!-- 3. حقل إدخال الرمز السري الحقيقي (قابل للكتابة) -->
        <input type="password" class="input-pin" maxlength="4" placeholder="">

        <!-- 4. زر الانتقال إلى لوحة القيادة عند الضغط -->
        <a href="dashboard.html" class="hotspot-login" title="تسجيل الدخول"></a>
    </div>

</body>
</html>
