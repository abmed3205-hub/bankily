<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Bankily - تسجيل الدخول</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; background-color: #ffffff; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        .app-screen { 
            position: relative; 
            width: 100%; 
            max-width: 430px; 
            height: 100vh; 
        }
        
        .app-screen img { 
            width: 100%; 
            height: 100%; 
            object-fit: fill; 
            display: block; 
        }
        
        /* زر تفاعلي شفاف فوق زر تسجيل الدخول في صورتك */
        .hotspot-login {
            position: absolute;
            top: 55%;     /* عدل هذه النسبة حسب مكان زر الدخول في صورتك */
            left: 7%;     /* موقع الزر أفقياً */
            width: 86%;   /* عرض منطقة النقر */
            height: 52px; /* ارتفاع منطقة النقر */
            background: transparent;
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body>

    <div class="app-screen">
        <!-- عرض صورة واجهة تسجيل الدخول الأصلية -->
        <img src="login.png" alt="Login">

        <!-- رابط شفاف يوجه المستخدم إلى لوحة القيادة dashboard.html عند الضغط على زر الدخول -->
        <a href="dashboard.html" class="hotspot-login"></a>
    </div>

</body>
</html>
