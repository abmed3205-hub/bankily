<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Bankily - تسجيل الدخول</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; background-color: #ffffff; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        .app-screen { 
            position: relative; 
            width: 100%; 
            max-width: 430px; 
            height: 100vh; 
        }
        
        .app-screen img { 
            width: 100%; 
            height: 100%; 
            object-fit: fill; 
            display: block; 
        }
        
        /* حقل رقم الهاتف المضبوط فوق الخط في الصورة */
        .input-phone {
            position: absolute;
            top: 38.5%;   
            left: 12%;    
            width: 76%;   
            height: 45px; 
            background: transparent;
            border: none;
            outline: none;
            font-size: 18px;
            font-weight: 600;
            text-align: right;
            color: #000;
        }

        /* حقل الرقم السري المضبوط فوق خانات النقاط */
        .input-pin {
            position: absolute;
            top: 51.5%;   
            left: 32%;    
            width: 36%;   
            height: 45px; 
            background: transparent;
            border: none;
            outline: none;
            font-size: 22px;
            letter-spacing: 10px;
            text-align: center;
            color: #000;
        }

        /* زر تسجيل الدخول الأصفر في الأسفل */
        .hotspot-login {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: transparent;
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body>

    <div class="app-screen">
        <!-- 1. صورة واجهة تسجيل الدخول -->
        <img src="login.png" alt="Login">

        <!-- 2. حقل رقم الهاتف الحقيقي -->
        <input type="tel" class="input-phone" placeholder="">

        <!-- 3. حقل الرمز السري الحقيقي -->
        <input type="password" class="input-pin" maxlength="4" placeholder="">

        <!-- 4. زر الانتقال للوحة القيادة -->
        <a href="dashboard.html" class="hotspot-login" title="تسجيل الدخول"></a>
    </div>

</body>
</html>
