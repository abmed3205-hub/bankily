<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>لوحة القيادة</title>
<style>
  :root {
    --primary: #00bcd4;
    --yellow: #fbb91d;
    --blue: #1ba9c9;
    --text: #333;
    --border: #dfdfdf;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    background: #fff;
    color: var(--text);
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* الهيدر العلوي */
  .header { background: var(--primary); color: #fff; padding: 12px 14px 16px; }
  .header-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
  }
  .header-top h1 { font-size: 18px; font-weight: 600; margin: 0 auto; }
  .menu-btn { background: none; border: 0; color: #fff; font-size: 26px; cursor: pointer; line-height: 1; }
  
  /* الترتيب اليدوي الصحيح: حسابي (يمين)، تحويل الأموال (وسط)، تسديد مشتريات (يسار) */
  .quick { display: flex; justify-content: space-between; padding: 0 2px; }
  .quick a, .quick div {
    display: flex; flex-direction: column; align-items: center;
    gap: 6px; color: #fff; text-decoration: none; font-size: 12px; text-align: center; width: 32%; cursor: pointer;
  }
  .circle {
    width: 64px; height: 64px; border-radius: 50%;
    background: #0097a7; border: 2px solid #e6c84f;
    display: grid; place-items: center;
  }
  .circle svg { width: 32px; height: 32px; stroke: #fff; fill: none; stroke-width: 1.6; }

  /* شبكة البطاقات */
  .grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px; padding: 12px; flex: 1; align-content: start;
  }
  .card {
    border: 1px solid var(--border); border-radius: 6px; background: #fff;
    aspect-ratio: 1 / 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; text-decoration: none; color: var(--text);
    font-weight: 600; font-size: 12px; text-align: center; padding: 8px;
    cursor: pointer;
    transition: background .15s;
  }
  .card:active { background: #f1fbfd; }
  .card svg { width: 36px; height: 36px; fill: none; stroke-width: 1.8; }
  .blue svg { stroke: var(--blue); }
  .yellow svg { stroke: var(--yellow); }
  .g-icon {
    width: 40px; height: 40px; border-radius: 50%; background: var(--blue);
    color: #fff; display: grid; place-items: center; font-size: 22px; font-weight: 700;
  }

  /* الشريط السفلي */
  .tabbar {
    display: flex; border-top: 1px solid #e5e5e5; background: #fff;
    position: sticky; bottom: 0; padding: 8px 0 10px;
  }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    gap: 3px; font-size: 11px; color: #888; text-decoration: none; cursor: pointer;
  }
  .tab svg { width: 24px; height: 24px; fill: none; stroke: #888; stroke-width: 1.6; }
  .tab.active { color: var(--primary); }
  .tab.active svg { stroke: var(--primary); }
</style>
</head>
<body>

  <header class="header">
    <div class="header-top">
      <div style="width: 26px;"></div>
      <h1>لوحة القيادة</h1>
      <button class="menu-btn" aria-label="القائمة">&#9776;</button>
    </div>
    <nav class="quick">
      <!-- 1. حسابي (في اليمين تماماً) -->
      <div onclick="alert('حسابي')">
        <span class="circle">
          <svg viewBox="0 0 48 48"><path d="M10 8h28v32H10z"/><path d="M16 16h16M16 23h16M16 30h10"/></svg>
        </span>
        حسابي
      </div>
      <!-- 2. تحويل الأموال (في الوسط - ينقل لصفحة transfer.html) -->
      <a href="transfer.html">
        <span class="circle">
          <svg viewBox="0 0 48 48"><rect x="6" y="14" width="36" height="20" rx="2"/><circle cx="24" cy="24" r="4"/><path d="M14 42h20m-5-4 5 4-5 4"/></svg>
        </span>
        تحويل الأموال
      </a>
      <!-- 3. تسديد مشتريات (في اليسار) -->
      <div onclick="alert('تسديد مشتريات')">
        <span class="circle">
          <svg viewBox="0 0 48 48"><path d="M8 12h32v24H8z"/><path d="M14 20h12M14 26h8"/></svg>
        </span>
        تسديد مشتريات
      </div>
    </nav>
  </header>

  <main class="grid">
    <!-- السطر الأول -->
    <div class="card blue" onclick="alert('طلب دفتر شيكات')">
      <svg viewBox="0 0 48 48"><path d="M4 16h32v24H4z"/><path d="M10 24h20M10 31h14M38 6l4 4-14 20-5 2 2-5z"/></svg>
      طلب دفتر شيكات
    </div>
    <div class="card yellow" onclick="alert('تسديد الفواتير')">
      <svg viewBox="0 0 48 48"><path d="M12 6h24v36H12z"/><path d="M18 14h12M18 20h12M18 26h8"/></svg>
      تسديد الفواتير
    </div>
    <div class="card blue" onclick="alert('تعبئة رصيد الهاتف')">
      <svg viewBox="0 0 48 48"><rect x="12" y="4" width="24" height="40" rx="3"/><path d="M24 34V20m-6 5 6-6 6 6M20 40h8"/></svg>
      تعبئة رصيد الهاتف
    </div>

    <!-- السطر الثاني -->
    <div class="card yellow" onclick="alert('البطاقات البنكية')">
      <svg viewBox="0 0 48 48"><rect x="4" y="10" width="40" height="28" rx="4"/><rect x="10" y="17" width="10" height="8" rx="1"/><path d="M26 30h14"/></svg>
      البطاقات البنكية
    </div>
    <div class="card blue" onclick="alert('سحب النقود')">
      <svg viewBox="0 0 48 48"><rect x="8" y="6" width="32" height="8" rx="1"/><path d="M16 14v22h16V14M20 20h8M20 26h8"/></svg>
      سحب النقود
    </div>
    <div class="card yellow" onclick="alert('ب-باي')">
      <svg viewBox="0 0 48 48"><rect x="12" y="4" width="24" height="40" rx="3"/><path d="M17 14h14l-2 10H19zM20 30h8"/></svg>
      ب-باي
    </div>

    <!-- السطر الثالث -->
    <div class="card" onclick="alert('جيمتيل')">
      <span class="g-icon">G</span>
      جيمتيل
    </div>
    <div></div>
    <div></div>
  </main>

  <nav class="tabbar">
    <div class="tab active">
      <svg viewBox="0 0 32 32"><path d="M4 16 16 5l12 11M8 14v13h6v-8h4v8h6V14"/></svg>
      الرئيسية
    </div>
    <div class="tab">
      <svg viewBox="0 0 32 32"><path d="m16 4 3.7 7.6 8.3 1.2-6 5.9 1.4 8.3L16 23l-7.4 4 1.4-8.3-6-5.9 8.3-1.2z"/></svg>
      المفضلة
    </div>
    <div class="tab">
      <svg viewBox="0 0 32 32"><path d="M8 24V14a8 8 0 0 1 16 0v10l2 2H6zM13 28h6"/></svg>
      الاشعارات
    </div>
    <div class="tab">
      <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12"/><path d="M12 12.5a4 4 0 1 1 5.5 3.7c-1 .5-1.5 1.2-1.5 2.3M16 23v.5"/></svg>
      المساعدة
    </div>
  </nav>

</body>
</html>
