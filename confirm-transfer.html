<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Bankily - تحويل الأموال</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; background-color: #ffffff; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        .app-screen { 
            position: relative; 
            width: 100%; 
            max-width: 430px; 
            height: 100vh; 
        }
        
        .app-screen img { 
            width: 100%; 
            height: 100%; 
            object-fit: fill; 
            display: block; 
        }
        
        /* زر تفاعلي شفاف فوق خيار "إرسال الأموال" (المربع الأخضر في الصورة) */
        .hotspot-send {
            position: absolute;
            top: 12%;     /* موقع الزر رأسياً */
            left: 52%;    /* موقع الزر أفقياً */
            width: 44%;   /* عرض منطقة النقر */
            height: 110px;/* ارتفاع منطقة النقر */
            background: transparent;
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body>

    <div class="app-screen">
        <!-- عرض صورة تحويل الأموال -->
        <img src="transfer.png" alt="Transfer Menu">

        <!-- رابط شفاف يوجه إلى صفحة التأكيد confirm-transfer.html عند النقر على خيار إرسال الأموال -->
        <a href="confirm-transfer.html" class="hotspot-send"></a>
    </div>

</body>
</html>
