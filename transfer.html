<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحويل أموال</title>
<style>
  :root {
    --primary: #00bcd4;
    --yellow: #fbb91d;
    --blue-card: #1ba9c9;
    --text: #333;
    --border: #e0e0e0;
    --gray-bg: #f8f9fa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    background: var(--gray-bg);
    color: var(--text);
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* الهيدر العلوي */
  .header { background: var(--primary); color: #fff; padding: 14px 16px; }
  .header-top {
    display: flex; align-items: center; justify-content: space-between;
  }
  .header-top h1 { font-size: 18px; font-weight: 600; margin: 0 auto; }
  .back-btn { background: none; border: 0; color: #fff; cursor: pointer; display: grid; place-items: center; text-decoration: none; }
  .back-btn svg { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 2.5; }

  /* البطابتان العلويتان (إرسال الأموال يمين، طلب المال يسار) */
  .top-cards-container {
    display: flex; gap: 10px; background: var(--primary); padding: 0 12px 16px;
  }
  .big-card {
    flex: 1; border-radius: 6px; padding: 22px 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; text-decoration: none; color: #fff;
    font-weight: 700; font-size: 15px; text-align: center;
    cursor: pointer;
  }
  .big-card.yellow { background: var(--yellow); }
  .big-card.blue { background: var(--blue-card); }
  .big-card svg { width: 40px; height: 40px; stroke: #fff; fill: none; stroke-width: 2; }

  /* قسم التحويل السريع */
  .section-title {
    font-size: 15px; font-weight: 600; text-align: center;
    margin: 20px 0 10px; color: #111;
  }

  .qr-box {
    background: #fff; margin: 0 16px; border-radius: 8px; padding: 24px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; border: 1px solid var(--border); cursor: pointer;
  }
  .qr-box svg { width: 36px; height: 36px; stroke: var(--primary); fill: none; stroke-width: 2; }
  .qr-box span { font-size: 14px; font-weight: 600; color: #333; }

  /* قسم اللوحة */
  .board-section {
    padding: 16px; text-align: center; margin-top: 5px;
  }
  .board-desc {
    font-size: 12px; color: #666; margin-bottom: 20px;
  }
  .add-board-btn {
    width: 64px; height: 64px; border: 2px dashed var(--primary); border-radius: 12px;
    background: #fff; display: inline-grid; place-items: center; cursor: pointer;
    margin: 0 auto;
  }
  .add-board-btn svg { width: 32px; height: 32px; stroke: var(--primary); fill: none; stroke-width: 2.5; }
</style>
</head>
<body>

  <header class="header">
    <div class="header-top">
      <a href="index.html" class="back-btn">
        <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>
      </a>
      <h1>تحويل أموال</h1>
      <div style="width: 24px;"></div>
    </div>
  </header>

  <div class="top-cards-container">
    <a href="send-money.html" class="big-card blue">
      <svg viewBox="0 0 48 48"><path d="M8 24h32m-8-8l8 8-8 8"/><path d="M16 14v20"/></svg>
      إرسال الأموال
    </a>
    <a href="javascript:void(0);" onclick="alert('طلب المال')" class="big-card yellow">
      <svg viewBox="0 0 48 48"><path d="M40 24H8m8-8l-8 8 8 8"/><path d="M32 14v20"/></svg>
      طلب المال
    </a>
  </div>

  <div class="section-title">التحويل السريع</div>
  <div class="qr-box" onclick="alert('رمز QR')">
    <svg viewBox="0 0 48 48"><rect x="6" y="6" width="14" height="14" rx="2"/><rect x="28" y="6" width="14" height="14" rx="2"/><rect x="6" y="28" width="14" height="14" rx="2"/><path d="M28 28h6v6h-6zM38 38h4v4h-4zM28 38h4v4h-4zM38 28h4v4h-4z"/></svg>
    <span>رمز QR</span>
  </div>

  <div class="section-title" style="margin-top: 24px;">اللوحة</div>
  <div class="board-section">
    <p class="board-desc">أنشئ مجموعة جديدة أو حدد مجموعة حالية لتقسيم اللوحة.</p>
    <div class="add-board-btn" onclick="alert('إضافة مجموعة جديدة')">
      <svg viewBox="0 0 24 24"><path d="M12 5v14m-7-7h14"/></svg>
    </div>
  </div>

</body>
</html>
